name: AI Service CI (FastAPI)

on:
  push:
    branches: [ master, main, release ]
    paths:
      - 'src/EnjoyEveryday.AiAgent/**'
      - '.github/workflows/ai-service-ci.yml'
      - '.dockerignore'
  pull_request:
    branches: [ master, main, release ]
    paths:
      - 'src/EnjoyEveryday.AiAgent/**'
      - '.github/workflows/ai-service-ci.yml'
      - '.dockerignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/enjoyeveryday-ai-service

permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    name: Python 3.12 Test & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/EnjoyEveryday.AiAgent
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'src/EnjoyEveryday.AiAgent/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q app tests

      - name: Run pytest suite
        run: pytest -v

  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push FastAPI Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./src/EnjoyEveryday.AiAgent
          file: ./src/EnjoyEveryday.AiAgent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest & build summary
        run: |
          {
            echo "### AI Service Build Summary"
            echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- **Commit SHA**: \`${{ github.sha }}\`"
            echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`"
            echo "- **Quick Deploy**: \`./scripts/deploy.ps1 -Service ai-service -Tag ${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

