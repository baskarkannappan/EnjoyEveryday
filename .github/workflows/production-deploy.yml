name: Production Deploy & Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy or roll back'
        required: true
        default: 'ai-service'
        type: choice
        options:
          - ai-service
          - api
          - ui
          - all
      image_tag:
        description: 'Immutable Git commit SHA tag (e.g. full 40-char SHA or sha-xxxxxxx)'
        required: true
        type: string
      rollback:
        description: 'Mark as rollback release in deployment summary'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: read

jobs:
  verify-artifacts:
    name: Verify Immutable GHCR Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify target image manifest exists in GHCR
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${{ inputs.image_tag }}"
          SVC="${{ inputs.service }}"

          check_image() {
            local img="$1:$TAG"
            echo "Checking manifest for $img..."
            docker manifest inspect "$img" > /dev/null
          }

          if [ "$SVC" = "ai-service" ] || [ "$SVC" = "all" ]; then
            check_image "${{ env.REGISTRY }}/$OWNER/enjoyeveryday-ai-service"
          fi
          if [ "$SVC" = "api" ] || [ "$SVC" = "all" ]; then
            check_image "${{ env.REGISTRY }}/$OWNER/enjoyeveryday-api"
          fi
          if [ "$SVC" = "ui" ] || [ "$SVC" = "all" ]; then
            check_image "${{ env.REGISTRY }}/$OWNER/enjoyeveryday-ui"
          fi

      - name: Publish deployment & rollback instructions
        run: |
          {
            echo "### Production Deployment Plan (${{ inputs.rollback && 'ROLLBACK' || 'ROLLOUT' }})"
            echo "- **Service**: \`${{ inputs.service }}\`"
            echo "- **Target Tag**: \`${{ inputs.image_tag }}\`"
            echo "- **Registry**: \`${{ env.REGISTRY }}/${{ github.repository_owner }}\`"
            echo ""
            echo "#### Zero-Downtime Single-Service Command"
            echo "\`\`\`powershell"
            echo ".\scripts\deploy.ps1 -Service ${{ inputs.service }} -Tag ${{ inputs.image_tag }}"
            echo "\`\`\`"
            echo "#### Instant Rollback Command"
            echo "\`\`\`powershell"
            echo ".\scripts\deploy.ps1 -Service ${{ inputs.service }} -Rollback"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

