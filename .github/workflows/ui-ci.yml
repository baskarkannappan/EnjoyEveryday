name: UI CI (.NET Blazor Portals)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/EnjoyEveryday.Daycare.Web/**'
      - 'src/EnjoyEveryday.Admin.Web/**'
      - 'src/EnjoyEveryday.Parent.Web/**'
      - 'src/EnjoyEveryday.UI.Shared/**'
      - 'src/EnjoyEveryday.Application/**'
      - 'src/EnjoyEveryday.Domain/**'
      - 'src/EnjoyEveryday.Infrastructure/**'
      - 'src/EnjoyEveryday.Shared/**'
      - '.github/workflows/ui-ci.yml'
      - '.dockerignore'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/EnjoyEveryday.Daycare.Web/**'
      - 'src/EnjoyEveryday.Admin.Web/**'
      - 'src/EnjoyEveryday.Parent.Web/**'
      - 'src/EnjoyEveryday.UI.Shared/**'
      - 'src/EnjoyEveryday.Application/**'
      - 'src/EnjoyEveryday.Domain/**'
      - 'src/EnjoyEveryday.Infrastructure/**'
      - 'src/EnjoyEveryday.Shared/**'
      - '.github/workflows/ui-ci.yml'
      - '.dockerignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-ui:
    name: Build & Push ${{ matrix.image_suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: src/EnjoyEveryday.Daycare.Web/EnjoyEveryday.Daycare.Web.csproj
            dockerfile: src/EnjoyEveryday.Daycare.Web/Dockerfile
            image_suffix: enjoyeveryday-ui
          - project: src/EnjoyEveryday.Admin.Web/EnjoyEveryday.Admin.Web.csproj
            dockerfile: src/EnjoyEveryday.Admin.Web/Dockerfile
            image_suffix: enjoyeveryday-admin-ui
          - project: src/EnjoyEveryday.Parent.Web/EnjoyEveryday.Parent.Web.csproj
            dockerfile: src/EnjoyEveryday.Parent.Web/Dockerfile
            image_suffix: enjoyeveryday-parent-ui
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore & Build UI project
        run: |
          dotnet restore ${{ matrix.project }}
          dotnet build ${{ matrix.project }} -c Release --no-restore

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=,format=long
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI Docker image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest & build summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.image_suffix }} Build Summary"
            echo "- **Image**: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_suffix }}\`"
            echo "- **Commit SHA**: \`${{ github.sha }}\`"
            echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

