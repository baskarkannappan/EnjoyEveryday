name: API CI (.NET ASP.NET Core)

on:
  push:
    branches: [ master, main, release ]
    paths:
      - 'src/EnjoyEveryday.Api/**'
      - 'src/EnjoyEveryday.Application/**'
      - 'src/EnjoyEveryday.Domain/**'
      - 'src/EnjoyEveryday.Infrastructure/**'
      - 'src/EnjoyEveryday.Shared/**'
      - '.github/workflows/api-ci.yml'
      - '.dockerignore'
  pull_request:
    branches: [ master, main, release ]
    paths:
      - 'src/EnjoyEveryday.Api/**'
      - 'src/EnjoyEveryday.Application/**'
      - 'src/EnjoyEveryday.Domain/**'
      - 'src/EnjoyEveryday.Infrastructure/**'
      - 'src/EnjoyEveryday.Shared/**'
      - '.github/workflows/api-ci.yml'
      - '.dockerignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/enjoyeveryday-api

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    name: Restore & Build .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore API project
        run: dotnet restore src/EnjoyEveryday.Api/EnjoyEveryday.Api.csproj

      - name: Build API project
        run: dotnet build src/EnjoyEveryday.Api/EnjoyEveryday.Api.csproj -c Release --no-restore

  build-and-push:
    name: Build & Push API Docker Image
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/EnjoyEveryday.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest & build summary
        run: |
          {
            echo "### API Build Summary"
            echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- **Commit SHA**: \`${{ github.sha }}\`"
            echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

