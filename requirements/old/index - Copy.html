<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnjoyEveryday</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-mark">✦</div>

            <div>
                <div class="brand-name">EnjoyEveryday</div>
                <div class="brand-subtitle">Experience Platform</div>
            </div>
        </div>


        <!-- TENANT SWITCHER -->
        <div class="tenant-selector" onclick="openTenantSwitcher()">

            <div class="tenant-icon" id="tenantIcon">🌱</div>

            <div class="tenant-info">

                <div class="tenant-label">
                    DAYCARE
                </div>

                <div class="tenant-name" id="sidebarTenantName">
                    Little Stars Daycare
                </div>

                <div class="tenant-branch" id="sidebarTenantBranch">
                    Main Branch
                </div>

            </div>

            <div class="tenant-arrow">⌄</div>

        </div>


        <!-- NAVIGATION -->
        <nav class="navigation">

            <div class="nav-section-title">
                TODAY
            </div>

            <button class="nav-item active" data-page="today">
                <span>☀</span>
                <span>Today</span>
            </button>


            <div class="nav-section-title">
                EXPERIENCE
            </div>

            <button class="nav-item" data-page="experiences">
                <span>✦</span>
                <span>Experience Explorer</span>
            </button>

            <button class="nav-item" data-page="ai">
                <span>◌</span>
                <span>Ask AI</span>
            </button>


            <div class="nav-section-title">
                PEOPLE
            </div>

            <button class="nav-item" data-page="children">
                <span>●</span>
                <span>Children</span>
            </button>

            <button class="nav-item" data-page="classrooms">
                <span>▦</span>
                <span>Classrooms</span>
            </button>

            <button class="nav-item" data-page="teachers">
                <span>♧</span>
                <span>Teachers</span>
            </button>


            <div class="nav-section-title">
                JOURNEY
            </div>

            <button class="nav-item" data-page="journey">
                <span>⌁</span>
                <span>Child Journey</span>
            </button>

            <button class="nav-item" data-page="stories">
                <span>♡</span>
                <span>Parent Stories</span>
            </button>


            <div class="nav-section-title">
                MANAGEMENT
            </div>

            <button class="nav-item" data-page="management">
                <span>▥</span>
                <span>Management</span>
            </button>

            <button class="nav-item" data-page="platform">
                <span>◈</span>
                <span>Platform</span>
            </button>

            <button class="nav-item" data-page="settings">
                <span>⚙</span>
                <span>Settings</span>
            </button>

        </nav>


        <!-- SIDEBAR FOOTER -->
        <div class="sidebar-footer">

            <div class="teacher-mini">

                <div class="avatar">
                    P
                </div>

                <div>
                    <div class="teacher-name">Priya</div>
                    <div class="teacher-role">Teacher</div>
                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <div>

                <div class="breadcrumb">
                    <span id="breadcrumbTenant">
                        Little Stars Daycare
                    </span>

                    <span> / </span>

                    <span id="breadcrumbPage">
                        Today
                    </span>
                </div>

            </div>

            <div class="top-actions">

                <button class="icon-button">
                    ?
                </button>

                <button class="icon-button">
                    ♧
                </button>

            </div>

        </header>


        <!-- CONTENT -->
        <section class="content" id="appContent">

        </section>

    </main>

</div>


<!-- TENANT SWITCHER MODAL -->

<div class="modal-overlay hidden" id="tenantModal">

    <div class="modal tenant-modal">

        <div class="modal-header">

            <div>
                <div class="modal-title">
                    Switch Daycare
                </div>

                <div class="modal-subtitle">
                    Choose the daycare context
                </div>
            </div>

            <button class="close-button" onclick="closeTenantSwitcher()">
                ×
            </button>

        </div>


        <div id="tenantList"></div>


        <button class="add-tenant">
            + Add daycare
        </button>

    </div>

</div>


<!-- EXPERIENCE MODAL -->

<div class="modal-overlay hidden" id="experienceModal">

    <div class="modal experience-modal">

        <button class="close-button experience-close"
                onclick="closeExperience()">
            ×
        </button>

        <div id="experienceDetail"></div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
