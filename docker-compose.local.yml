# Local source-build override for Docker Desktop development.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  ai-service:
    build:
      context: ./src/EnjoyEveryday.AiAgent
      dockerfile: Dockerfile

  api:
    build:
      context: .
      dockerfile: src/EnjoyEveryday.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  web:
    build:
      context: .
      dockerfile: src/EnjoyEveryday.Daycare.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  admin-web:
    build:
      context: .
      dockerfile: src/EnjoyEveryday.Admin.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  parent-web:
    build:
      context: .
      dockerfile: src/EnjoyEveryday.Parent.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

